name: Build Windows Installer

on:
  # Run manually from the Actions tab in GitHub
  workflow_dispatch:
    inputs:
      release_note:
        description: 'What changed in this build? (optional)'
        required: false
        default: ''

  # Run automatically on every push to main, and when a version tag is
  # pushed (e.g. v1.0.1). Pushes to main produce a unique tracked release;
  # version tags produce a proper versioned release.
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build the .NET sidecar that attaches to the running ETABS instance
      # through the .NET API (ETABSv1.dll via reflection — no COM, no native
      # node modules). Bundled into the installer as resources/etabs-helper.
      - name: Build ETABS helper (.NET sidecar)
        run: npm run build:helper

      - name: Verify ETABS helper exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build-helper/EtabsHelper.exe")) {
            Write-Error "EtabsHelper.exe not produced by dotnet publish"; exit 1
          }
          Write-Host "Helper: $((Get-Item build-helper/EtabsHelper.exe).FullName)"

      - name: Verify S-Concrete helper exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build-helper-sconcrete/SConcreteHelper.exe")) {
            Write-Error "SConcreteHelper.exe not produced by dotnet publish"; exit 1
          }
          Write-Host "S-Concrete helper: $((Get-Item build-helper-sconcrete/SConcreteHelper.exe).FullName)"

      - name: Build web assets (Vite)
        run: npm run build

      - name: Package Windows installer (electron-builder)
        run: npx electron-builder --win --publish never
        env:
          # Prevents electron-builder from trying to sign the installer
          # (no certificate configured). Remove when a code-signing cert is added.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify ETABS helper is packaged
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\resources\etabs-helper\EtabsHelper.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "EtabsHelper.exe not found in packaged resources at: $exe"
            exit 1
          }
          Write-Host "Packaged helper: $((Get-Item $exe).FullName)"

      - name: Verify S-Concrete helper is packaged
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\resources\sconcrete-helper\SConcreteHelper.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "SConcreteHelper.exe not found in packaged resources at: $exe"
            exit 1
          }
          Write-Host "Packaged S-Concrete helper: $((Get-Item $exe).FullName)"

      - name: Find installer path
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # Build a unique tag + date for this run so every build is its own
      # entry in the Releases list (e.g. build-42-a1b2c3d).
      - name: Compute build metadata
        id: meta
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0,7)
          $date  = Get-Date -Format "yyyy-MM-dd HH:mm"
          echo "tag=build-${{ github.run_number }}-$short" >> $env:GITHUB_OUTPUT
          echo "date=$date" >> $env:GITHUB_OUTPUT
          echo "short=$short" >> $env:GITHUB_OUTPUT

      # Always upload as a downloadable artifact (visible under the workflow run)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SConcrete-Design-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      # On push to main or manual dispatch: create a UNIQUE pre-release per
      # build so the Releases list keeps a full history of every change.
      - name: Create build release (main push / manual)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Build ${{ github.run_number }} (${{ steps.meta.outputs.date }})"
          prerelease: true
          body: |
            Automated Windows build.

            - **Commit:** ${{ steps.meta.outputs.short }} (`${{ github.ref_name }}`)
            - **Built:** ${{ steps.meta.outputs.date }}

            Download `${{ steps.find_exe.outputs.name }}` below and run it to install S-Dashboard on Windows.

            ${{ github.event.inputs.release_note }}
          files: release/*.exe

      # On version tag push: create a proper versioned release
      - name: Create versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "S-Dashboard ${{ github.ref_name }}"
          generate_release_notes: true
          files: release/*.exe
